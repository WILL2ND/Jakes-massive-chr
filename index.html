<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Rendering Engine Stress Test</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #080808;
            color: #ffffff;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #ui-panel {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 8px;
            z-index: 99999;
            border: 2px solid #ff3333;
            width: 300px;
            box-shadow: 0 0 30px rgba(255,0,0,0.4);
        }

        .btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .btn.active { background: #33ff33; color: black; }

        #perf-status {
            font-size: 16px;
            color: #ff3333;
            margin-top: 10px;
            font-weight: bold;
        }

        #canvas-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Elements optimized to destroy rendering pipeline performance */
        .ultra-heavy-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,0,0,1) 0%, rgba(0,0,255,1) 100%);
            border-radius: 50%;
            /* Heavy blend modes force the GPU and CPU to calculate pixel interactions constantly */
            mix-blend-mode: difference;
            filter: blur(4px) drop-shadow(0px 0px 25px #00ff00);
            opacity: 0.6;
            will-change: auto; /* Prevents the browser from optimizing early */
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h3 style="margin:0; color:#ff3333;">⚠️ MAXIMUM STRESS LOAD</h3>
        <p style="font-size:11px; color:#aaa; margin: 8px 0;">Injecting 5,000 layers combined with intensive forced layout calculations and main-thread computation loops.</p>
        <div id="perf-status">FPS: Measuring...</div>
        <button id="burn-btn" class="btn">Engage Absolute Lag</button>
    </div>

    <div id="canvas-plane"></div>

    <script>
        const plane = document.getElementById('canvas-plane');
        const burnBtn = document.getElementById('burn-btn');
        const perfStatus = document.getElementById('perf-status');
        
        let extremeLagActive = false;
        const totalElements = 5000; // Multiplied density
        const nodeCollection = [];

        // Generate massive DOM tree
        for (let i = 0; i < totalElements; i++) {
            const el = document.createElement('div');
            el.className = 'ultra-heavy-node';
            
            // Generate arbitrary positions
            const posX = Math.random() * window.innerWidth;
            const posY = Math.random() * window.innerHeight;
            
            el.style.left = posX + 'px';
            el.style.top = posY + 'px';
            
            plane.appendChild(el);
            
            nodeCollection.push({
                dom: el,
                x: posX,
                y: posY,
                speedX: (Math.random() - 0.5) * 15,
                speedY: (Math.random() - 0.5) * 15
            });
        }

        // Heavy analytical CPU-blocking function (simulates hard calculation workload)
        function forceCpuBlock(durationMs) {
            const start = performance.now();
            let stringCruncher = "lag_simulation_string";
            while (performance.now() - start < durationMs) {
                // Perform completely useless, memory-allocating modifications to jam the core
                stringCruncher = btoa(stringCruncher).substring(0, 100) + Math.random();
            }
        }

        // High-stress execution loop
        function heavyEngineLoop() {
            if (extremeLagActive) {
                // 1. Force a strict 20ms block on the main execution thread every single frame
                forceCpuBlock(20);
            }

            for (let i = 0; i < nodeCollection.length; i++) {
                const node = nodeCollection[i];
                
                node.x += node.speedX;
                node.y += node.speedY;

                if (node.x < 0 || node.x > window.innerWidth - 40) node.speedX *= -1;
                if (node.y < 0 || node.y > window.innerHeight - 40) node.speedY *= -1;

                if (extremeLagActive) {
                    /*
                      2. MULTI-LAYERED LAYOUT REFLOWS
                      Updating geometric styles directly and calling properties that demand 
                      instant recalculation (getBoundingClientRect) crashes browser frame queuing.
                    */
                    node.dom.style.left = node.x + 'px';
                    node.dom.style.top = node.y + 'px';
                    
                    // The browser is forced to immediately stop and evaluate layout boundaries 5000 times
                    const structuralReflow = node.dom.getBoundingClientRect().width;
                } else {
                    // Optimized GPU fallback loop
                    node.dom.style.transform = `translate3d(${node.x}px, ${node.y}px, 0)`;
                    node.dom.style.top = '0px';
                    node.dom.style.left = '0px';
                }
            }

            requestAnimationFrame(heavyEngineLoop);
        }

        // Real-time Frame Estimator
        let lastTime = performance.now();
        function runDiagnostics() {
            const now = performance.now();
            const frameDelta = now - lastTime;
            lastTime = now;
            
            const currentFps = Math.round(1000 / frameDelta);
            perfStatus.textContent = `FPS: ${isFinite(currentFps) ? currentFps : 0}`;
            
            if (currentFps > 30) perfStatus.style.color = "#33ff33";
            else if (currentFps > 10) perfStatus.style.color = "#ffaa00";
            else perfStatus.style.color = "#ff3333";

            requestAnimationFrame(runDiagnostics);
        }

        // Toggle execution state
        burnBtn.addEventListener('click', () => {
            extremeLagActive = !extremeLagActive;
            if (extremeLagActive) {
                burnBtn.textContent = "Disengage Load";
                burnBtn.classList.add('active');
            } else {
                burnBtn.textContent = "Engage Absolute Lag";
                burnBtn.classList.remove('active');
            }
        });

        // Initialize execution routines
        requestAnimationFrame(heavyEngineLoop);
        requestAnimationFrame(runDiagnostics);
    </script>
</body>
</html>
