<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laggy Rendering Engine Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* UI Control Panel Overlay */
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 12px;
            z-index: 9999;
            border: 1px solid #333;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; color: #ff4757; font-size: 20px; }
        p { font-size: 13px; color: #aaa; line-height: 1.5; }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn.active { background: #2ed573; }

        #fps-counter {
            font-family: monospace;
            font-size: 18px;
            color: #2ed573;
            margin-top: 10px;
            font-weight: bold;
        }

        /* --- THE LAG CAUSERS --- */
        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Overwhelming amount of DOM nodes with complex CSS styles */
        .heavy-box {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            border-radius: 15px;
            /* Box shadows and filters heavily tax the browser's painting pipeline */
            box-shadow: 0px 0px 30px 10px rgba(255, 0, 127, 0.4);
            filter: blur(2px);
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2>Rendering Stress Test</h2>
        <p>This demo creates 1,500 unoptimized DOM nodes [2] and forces continuous style/layout recalculations to choke the main thread [4].</p>
        
        <div id="fps-counter">FPS: Measuring...</div>
        <button id="toggle-btn" class="btn">Engage Heavy Lag</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const toggleBtn = document.getElementById('toggle-btn');
        const fpsCounter = document.getElementById('fps-counter');
        
        let isLagging = false;
        const boxCount = 1500; // Total complex elements to render [2]
        const boxes = [];

        // 1. Create the heavy elements [2]
        for (let i = 0; i < boxCount; i++) {
            const box = document.createElement('div');
            box.className = 'heavy-box';
            
            // Randomly scatter across the screen
            box.style.left = Math.random() * window.innerWidth + 'px';
            box.style.top = Math.random() * window.innerHeight + 'px';
            
            container.appendChild(box);
            
            // Store properties for JS physics calculation
            boxes.push({
                element: box,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                dx: (Math.random() - 0.5) * 8,
                dy: (Math.random() - 0.5) * 8
            });
        }

        // 2. The Main Animation Loop
        function renderLoop() {
            for (let i = 0; i < boxes.length; i++) {
                const b = boxes[i];
                
                // Update coordinates
                b.x += b.dx;
                b.y += b.dy;

                // Bounce off edges
                if (b.x < 0 || b.x > window.innerWidth - 80) b.dx *= -1;
                if (b.y < 0 || b.y > window.innerHeight - 80) b.dy *= -1;

                if (isLagging) {
                    /* 
                       CRITICAL LAG CAUSE: Layout Thrashing.
                       By updating style properties ('top/left') AND immediately reading 
                       offset measurements in a loop, we force the browser to recalculate 
                       the layout hundreds of times in a single frame.
                    */
                    b.element.style.left = b.x + 'px';
                    b.element.style.top = b.y + 'px';
                    
                    // Reading this properties forces a Synchronous Layout Reflow [4]
                    const forceReflow = b.element.offsetHeight + b.element.offsetLeft;
                } else {
                    // Optimized path: Smooth execution using GPU-friendly composition transforms [1, 3]
                    b.element.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
                    b.element.style.top = '0px';
                    b.element.style.left = '0px';
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // 3. Simple Real-time FPS Monitor [5]
        let lastCalledTime;
        let fps;
        function calcFps() {
            if (!lastCalledTime) {
                lastCalledTime = performance.now();
                fps = 0;
            } else {
                let delta = (performance.now() - lastCalledTime) / 1000;
                lastCalledTime = performance.now();
                fps = Math.round(1 / delta);
                fpsCounter.textContent = `FPS: ${fps}`;
                
                // Color code the counter based on lag
                if (fps > 45) fpsCounter.style.color = '#2ed573';
                else if (fps > 20) fpsCounter.style.color = '#ffa502';
                else fpsCounter.style.color = '#ff4757';
            }
            requestAnimationFrame(calcFps);
        }

        // 4. Toggle Interaction
        toggleBtn.addEventListener('click', () => {
            isLagging = !isLagging;
            if (isLagging) {
                toggleBtn.textContent = "Stop Lag Stress Test";
                toggleBtn.classList.add('active');
            } else {
                toggleBtn.textContent = "Engage Heavy Lag";
                toggleBtn.classList.remove('active');
            }
        });

        // Initialize loops
        requestAnimationFrame(renderLoop);
        requestAnimationFrame(calcFps);
    </script>
</body>
</html>
